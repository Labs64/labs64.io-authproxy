<text x="600" y="27" class="mono" font-size="13" fill="#87888A" text-anchor="middle" letter-spacing="0.5">labs64.io-authproxy · GET /auth</text>
<text x="64" y="100" class="sans" font-size="13" font-weight="500" fill="#F08B53" letter-spacing="3.6">LABS64.IO  ·  API GATEWAY</text>
<text x="64" y="156" class="sans" font-size="48" font-weight="700" fill="#F8EDE5" letter-spacing="-1.4">One front door. Every module.</text>
<text x="64" y="212" class="sans" font-size="48" font-weight="700" fill="#E14817" letter-spacing="-1.4">Verified before it is forwarded.</text>
<text x="1136" y="212" class="mono" font-size="14" fill="#F8EDE5" fill-opacity="0.6" text-anchor="end">OIDC/JWT  ·  Cerbos  ·  fails closed</text>
<text x="64" y="262" class="mono" font-size="12" fill="#87888A" letter-spacing="2.4">OUTSIDE</text><rect x="64" y="278" width="196" height="48" rx="10" fill="#F8EDE5" fill-opacity=".05" stroke="#F8EDE5" stroke-opacity=".2"/><text x="84" y="299" class="sans" font-size="14" font-weight="700" fill="#F8EDE5">Browser app</text><text x="84" y="316" class="mono" font-size="11" fill="#F08B53">user token</text><rect x="64" y="348" width="196" height="48" rx="10" fill="#F8EDE5" fill-opacity=".05" stroke="#F8EDE5" stroke-opacity=".2"/><text x="84" y="369" class="sans" font-size="14" font-weight="700" fill="#F8EDE5">Backend service</text><text x="84" y="386" class="mono" font-size="11" fill="#F08B53">client credentials</text><rect x="64" y="418" width="196" height="48" rx="10" fill="#F8EDE5" fill-opacity=".05" stroke="#F8EDE5" stroke-opacity=".2"/><text x="84" y="439" class="sans" font-size="14" font-weight="700" fill="#F8EDE5">CI job</text><text x="84" y="456" class="mono" font-size="11" fill="#F08B53">service principal</text><rect x="64" y="488" width="196" height="48" rx="10" fill="#F8EDE5" fill-opacity=".05" stroke="#F8EDE5" stroke-opacity=".2"/><text x="84" y="509" class="sans" font-size="14" font-weight="700" fill="#F8EDE5">AI agent</text><text x="84" y="526" class="mono" font-size="11" fill="#F08B53">scoped token</text><rect x="400" y="262" width="736" height="290" fill="#F8EDE5" fill-opacity=".025" stroke="#F8EDE5" stroke-opacity=".55" stroke-width="3"/><rect x="396" y="390" width="8" height="44" fill="#170A05"/><path d="M400,390 L432,374" stroke="#F8EDE5" stroke-opacity=".55" stroke-width="2"/><path d="M432,374 A36,36 0 0,1 436,412" fill="none" stroke="#F8EDE5" stroke-opacity=".3" stroke-dasharray="3 4"/><path d="M540,262 V380 M540,444 V552" stroke="#F8EDE5" stroke-opacity=".45" stroke-width="2"/><path d="M540,380 H1136 M540,444 H1136 M838,262 V380 M838,444 V552" stroke="#F8EDE5" stroke-opacity=".45" stroke-width="2"/><rect x="671" y="377" width="36" height="6" fill="#170A05"/><rect x="969" y="377" width="36" height="6" fill="#170A05"/><rect x="671" y="441" width="36" height="6" fill="#170A05"/><rect x="969" y="441" width="36" height="6" fill="#170A05"/><path d="M400,252 H1136 M400,248 V256 M1136,248 V256" stroke="#87888A" stroke-opacity=".5"/><text x="768" y="247" class="mono" font-size="11" fill="#87888A" text-anchor="middle">one entrance · every module behind it</text><text x="470" y="290" class="mono" font-size="11" fill="#87888A" text-anchor="middle" letter-spacing="2.4">LOBBY</text><text x="470" y="322" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.75" text-anchor="middle">verify token</text><text x="470" y="342" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.75" text-anchor="middle">match route</text><text x="470" y="362" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.75" text-anchor="middle">ask Cerbos</text><text x="470" y="486" class="mono" font-size="12" fill="#E14817" text-anchor="middle">fails</text><text x="470" y="504" class="mono" font-size="12" fill="#E14817" text-anchor="middle">closed</text><rect x="508" y="386" width="4" height="52" fill="#E14817" filter="url(#hglow)" opacity=".35"><animate attributeName="opacity" values=".35;1;.35;.35;1;.35;.35;1;.35" keyTimes="0;.05;.12;.38;.43;.5;.72;.76;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><rect x="541" y="262" width="296" height="118" fill="#E14817" opacity="0"><animate attributeName="opacity" values="0;0;.22;0;0" keyTimes="0;.01;.06;.2;1" dur="6s" begin="0.9s" repeatCount="indefinite"/></rect><text x="689" y="315" class="sans" font-size="17" font-weight="700" fill="#F8EDE5" text-anchor="middle">AuditFlow</text><text x="689" y="335" class="mono" font-size="12" fill="#F08B53" text-anchor="middle">audit events</text><rect x="839" y="262" width="296" height="118" fill="#E14817" opacity="0"><animate attributeName="opacity" values="0;0;.22;0;0" keyTimes="0;.01;.06;.2;1" dur="6s" begin="3.1s" repeatCount="indefinite"/></rect><text x="987" y="315" class="sans" font-size="17" font-weight="700" fill="#F8EDE5" text-anchor="middle">Payment Gateway</text><text x="987" y="335" class="mono" font-size="12" fill="#F08B53" text-anchor="middle">payments</text><text x="689" y="500" class="sans" font-size="17" font-weight="700" fill="#F8EDE5" text-anchor="middle">Checkout</text><text x="689" y="520" class="mono" font-size="12" fill="#F08B53" text-anchor="middle">orders</text><text x="987" y="500" class="sans" font-size="17" font-weight="700" fill="#F8EDE5" text-anchor="middle">Customer Portal</text><text x="987" y="520" class="mono" font-size="12" fill="#F08B53" text-anchor="middle">self-service</text><text x="838" y="418" class="mono" font-size="11.5" fill="#87888A" text-anchor="middle">corridor · X-Auth-User · X-Auth-Tenant · X-Auth-Scopes</text><path id="hd1" d="M260,302 C330,302 330,412 404,412 L689,412 L689,330" fill="none"/><path id="hd2" d="M260,372 C330,372 340,412 404,412 L987,412 L987,330" fill="none"/><path id="hd3" d="M260,512 C330,512 330,412 404,412 L500,412" fill="none"/><circle r="6" fill="#F8EDE5" filter="url(#hglow)" opacity="0"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.22;1" calcMode="linear"><mpath href="#hd1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.2;.23;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle><circle r="6" fill="#F8EDE5" filter="url(#hglow)" opacity="0"><animateMotion dur="6s" begin="1.9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.22;1" calcMode="linear"><mpath href="#hd2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.2;.23;1" dur="6s" begin="1.9s" repeatCount="indefinite"/></circle><circle r="6" fill="#F8EDE5" filter="url(#hglow)" opacity="0"><animateMotion dur="6s" begin="4" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.14;1" calcMode="linear"><mpath href="#hd3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.24;.28;1" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="fill" values="#F8EDE5;#F8EDE5;#E14817;#E14817" keyTimes="0;.13;.14;1" dur="6s" begin="4s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.14;.15;.26;.3;1" dur="6s" begin="4s" repeatCount="indefinite"/><rect x="424" y="430" width="92" height="26" rx="6" fill="#E14817"/><text x="470" y="448" class="mono" font-size="12" font-weight="500" fill="#F8EDE5" text-anchor="middle">403 · scope</text></g>
