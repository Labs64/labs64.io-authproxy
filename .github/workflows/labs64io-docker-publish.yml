name: Labs64.IO - Auth Gateway - Publish Docker

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@v1
    with:
      image: labs64/traefik-authproxy
      context: ./traefik-authproxy
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Opens a PR in labs64.io-helm-charts pinning the digest. The chart is named
  # api-gateway, not authproxy — it merged traefik-authproxy with gateway-common.
  propagate-to-chart:
    name: Pin digest in charts/api-gateway
    needs: publish
    uses: Labs64/labs64.io-workspace/.github/workflows/chart-update-dispatch.yml@v1
    with:
      chart: api-gateway
      version: ${{ github.event.release.tag_name }}
      images: ${{ needs.publish.outputs.image-ref }}
    secrets:
      CHART_DISPATCH_TOKEN: ${{ secrets.CHART_DISPATCH_TOKEN }}
